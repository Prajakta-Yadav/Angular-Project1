<!-- LOGIN PAGE -->
<div class="login-page d-flex align-items-center">

  <div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

      <!-- LOGIN CARD -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-5">

        <div class="card border-0 shadow-lg rounded-4 login-card">

          <div class="card-body p-4 p-md-5">

            <!-- HEADER -->
            <div class="text-center mb-4">

              <h2 class="fw-bold">

                Admin Login

              </h2>

              <p class="text-muted">

                Welcome back to PinkHeart Dashboard

              </p>

            </div>

            <!-- FORM -->
            <form [formGroup]="form">

              <!-- USERNAME -->
              <div class="mb-3">

                <label class="form-label fw-semibold">

                  Username

                </label>

                <input
                  type="text"
                  class="form-control form-control-lg rounded-3"
                  placeholder="Enter Username"
                  formControlName="username"
                >

                <!-- VALIDATION -->
                <small class="text-danger"
                       *ngIf="form.get('username')?.touched &&
                              form.get('username')?.invalid">

                  Username is required

                </small>

              </div>

              <!-- PASSWORD -->
              <div class="mb-3">

                <label class="form-label fw-semibold">

                  Password

                </label>

                <input
                  type="password"
                  class="form-control form-control-lg rounded-3"
                  placeholder="Enter Password"
                  formControlName="password"
                >

                <!-- VALIDATION -->
                <small class="text-danger"
                       *ngIf="form.get('password')?.touched &&
                              form.get('password')?.invalid">

                  Password is required

                </small>

              </div>

              <!-- REMEMBER -->
              <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check">

                  <input class="form-check-input"
                         type="checkbox">

                  <label class="form-check-label">

                    Remember me

                  </label>

                </div>

                <a href="#"
                   class="text-decoration-none"
                   style="color:#ec4899;">

                  Forgot Password?

                </a>

              </div>

              <!-- LOGIN BUTTON -->
              <div class="d-grid">

                <button
                  type="submit"
                  class="btn login-btn text-white rounded-3 py-3 fw-semibold"
                  (click)="onLogin()"
                >

                  Login

                </button>

              </div>

            </form>

            <!-- SIGNUP LINK -->
            <div class="text-center mt-4">

              <p class="mb-0 text-muted">

                Don't have an account?

                <a routerLink="/signup"
                   class="fw-semibold text-decoration-none"
                   style="color:#ec4899;">

                  Sign Up

                </a>

              </p>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
