
<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm" style="width: 100%;; max-width: 400px;">
        <div class="card-body p-4">

            <h3 class="card-title text-center mb-4">Admin Login</h3>
        <form >       
        <div class="mb-3">
            
            <input type="text" class="form-control" name="username" placeholder="Enter Username" [(ngModel)]="loginObj.username">
        </div>       
        <div class="mb-3">
            <input type="password" class="form-control" name="password" placeholder=" Enter Password"  [(ngModel)]="loginObj.password">

        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary" (click)="onLogin()">Login</button>
        </div>
    </form>

        <div class="mt-3 text-center">
            <p class="small mb-0">Don't have an acoount? <a routerLink="/">Sign up</a></p>

        </div>
    </div> 
    </div> 
</div>
